name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fish_erp
          POSTGRES_USER: fish_erp
          POSTGRES_PASSWORD: fish_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fish_erp -d fish_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://fish_erp:fish_erp@localhost:5432/fish_erp?schema=fish_erp
      JWT_ACCESS_SECRET: test-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-characters
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_SECONDS: 604800
      JWT_ISSUER: fish-erp-api-test
      JWT_AUDIENCE: fish-erp-client-test
      CORS_ORIGINS: http://localhost:3001
      SWAGGER_ENABLED: 'false'
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:validate
      # The project intentionally has no committed migration until the owner creates the fresh baseline.
      - run: pnpm exec prisma db push
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
