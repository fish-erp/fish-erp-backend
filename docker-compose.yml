services:
  postgres:
    image: postgres:18-alpine
    container_name: fish-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fish_erp
      POSTGRES_USER: fish_erp
      POSTGRES_PASSWORD: fish_erp
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - fish-erp-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fish_erp -d fish_erp']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fish-erp-postgres-data:
